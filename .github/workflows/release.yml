name: Release Dotnote
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified APK as a GitHub release
        type: boolean
        required: true
        default: true
      stable:
        description: Publish a stable release (leave unchecked for prerelease)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: dotnote-release
  cancel-in-progress: false
jobs:
  ipad:
    uses: ./.github/workflows/ios.yml
  release:
    needs: ipad
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate remote version history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.DOTNOTE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dotnote.keystore"
          chmod 600 "$RUNNER_TEMP/dotnote.keystore"
      - name: Build and check
        env:
          DOTNOTE_KEYSTORE: ${{ runner.temp }}/dotnote.keystore
          DOTNOTE_STORE_PASSWORD: ${{ secrets.DOTNOTE_STORE_PASSWORD }}
          DOTNOTE_KEY_ALIAS: ${{ secrets.DOTNOTE_KEY_ALIAS }}
          DOTNOTE_KEY_PASSWORD: ${{ secrets.DOTNOTE_KEY_PASSWORD }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew :shared:jvmTest :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update and note preservation regressions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_tablet
          script: |
            adb shell setprop debug.hwui.renderer skiagl
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python3 scripts/android-release-tests.py
      - name: Package verified release
        run: python3 scripts/package-release.py --require-release --apk android/app/build/outputs/apk/release/app-release.apk --output-dir "$RUNNER_TEMP/dotnote-release"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          retention-days: 7
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            /tmp/dotnote-instrumentation-*.log
            ${{ runner.temp }}/dotnote-release/
      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RELEASE: ${{ inputs.stable }}
        run: |
          args=(--publish "$RUNNER_TEMP/dotnote-release")
          if [[ "$STABLE_RELEASE" == "true" ]]; then
            args+=(--stable)
          fi
          python3 scripts/publish-release.py "${args[@]}"
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/dotnote.keystore"
