name: Release Dotnote
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dotnote-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate remote version history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
      - name: Configure signing
        env:
          KEYSTORE: ${{ secrets.DOTNOTE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dotnote.keystore"
          chmod 600 "$RUNNER_TEMP/dotnote.keystore"
      - name: Build and check
        env:
          DOTNOTE_KEYSTORE: ${{ runner.temp }}/dotnote.keystore
          DOTNOTE_STORE_PASSWORD: ${{ secrets.DOTNOTE_STORE_PASSWORD }}
          DOTNOTE_KEY_ALIAS: ${{ secrets.DOTNOTE_KEY_ALIAS }}
          DOTNOTE_KEY_PASSWORD: ${{ secrets.DOTNOTE_KEY_PASSWORD }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update and note preservation regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_tablet
          script: |
            adb shell setprop debug.hwui.renderer skiagl
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python3 scripts/android-release-tests.py
      - name: Package verified release
        run: python3 scripts/package-release.py --require-release --apk app/build/outputs/apk/release/app-release.apk --output-dir "$RUNNER_TEMP/dotnote-release"
      - name: Retain validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            app/build/reports/
            app/build/test-results/
            /tmp/dotnote-instrumentation-*.log
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --publish "$RUNNER_TEMP/dotnote-release"
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/dotnote.keystore"
